function makeSprite(rows, pal) {
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c;
}
const thugSprites = LEG_FRAMES.map(legs => makeSprite(SPRITE_ROWS.concat(legs), THUG_PAL));

// high-rise wall texture: concrete floors with lit and dark windows
const wallTex = (() => {
  const c = document.createElement("canvas");
  c.width = 64; c.height = 64;
  const g = c.getContext("2d");

  for (let y = 0; y < 64; y += 14) g.fillRect(0, y, 64, 2);

// distant city skyline strip (wraps horizontally for parallax)
const skyline = (() => {
  const c = document.createElement("canvas");
  c.width = 960; c.height = 70;
  const g = c.getContext("2d");
  let x = 0;
  while (x < 960) {
    const w = 24 + Math.random() * 40, h = 18 + Math.random() * 50;
    g.fillStyle = "#141a2e";
    g.fillRect(x, 70 - h, w, h);
    g.fillStyle = "rgba(216,168,69,.5)";
    for (let wy = 70 - h + 4; wy < 66; wy += 8)
      for (let wx = x + 3; wx < x + w - 4; wx += 8)

})();

// human-scale interior wall: painted panels, wainscot, skirting board

// steel exit door with an EXIT sign

function hash(k) { const x = Math.sin(k * 127.1) * 43758.5; return x - Math.floor(x); }

// --- shared ---

function isWall(x, y) {
  const c = (map[y | 0] || "")[x | 0];
  return c === undefined || c === "#" || c === "D";
}

function blocked(x, y) {
  return isWall(x - .2, y - .2) || isWall(x + .2, y - .2) || isWall(x - .2, y + .2) || isWall(x + .2, y + .2);
}

function loadStage(i) {
  mission = i;
  stage = STAGES[i];
  $("mission").textContent = i + 1;
  hurt = 0; gun = 0; gunCd = 0; joy = null;
  player = { x: 0, y: 0, a: 0, hp: 100 };
  if (stage.type === "raid") {
    map = stage.grid;
    enemies = []; doors = [];
    for (let y = 0; y < map.length; y++)
      for (let x = 0; x < map[y].length; x++) {
        const c = map[y][x];
        if (c === "P") { player.x = x + .5; player.y = y + .5; }
        if (c === "D") doors.push({ x: x + .5, y: y + .5 });
        if (c === "E") enemies.push({ x: x + .5, y: y + .5, hp: 2, cd: 1 + Math.random(), flash: 0, walk: 0, boss: false });
        if (c === "B") enemies.push({ x: x + .5, y: y + .5, hp: 6, cd: 1.5, flash: 0, walk: 0, boss: true });
      }
  } else {
    progress = 0; bikers = []; spawnCd = 1.2; playerX = 0; kills = 0;
    snipers = {}; deadSnipers = new Set();
    aim = { x: W / 2, y: H / 2 };
    if (document.pointerLockElement) document.exitPointerLock();
  }
  state = "story";
}

function stageClear() {
  if (mission + 1 < STAGES.length) loadStage(mission + 1);
  else {
    state = "won";
    const secs = Math.round(playTime);
    if (!best || secs < best) {
      best = secs;
      localStorage.setItem(BEST_KEY, best);
      $("best").textContent = best + "s";
      toast("New best run! 🏆");
    }
  }
}

// --- raid mode: raycaster ---

// DDA raycast; wallX is the fractional hit position for texturing
function cast(px, py, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx = px | 0, my = py | 0;
  const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx);
  const ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
  let sx, sy, sdx, sdy, side = 0;
  if (dx < 0) { sx = -1; sdx = (px - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - px) * ddx; }
  if (dy < 0) { sy = -1; sdy = (py - my) * ddy; } else { sy = 1; sdy = (my + 1 - py) * ddy; }
  for (let i = 0; i < 64; i++) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
    const ch = (map[my] || "")[mx];
    if (ch === undefined || ch === "#" || ch === "D") {
      const dist = side ? sdy - ddy : sdx - ddx;
      const w = side ? px + dist * dx : py + dist * dy;
      return { dist, side, wallX: w - Math.floor(w), door: ch === "D" };
    }
  }
  return { dist: 64, side: 0, wallX: 0, door: false };
}

function los(from, tx, ty) {
  const d = Math.hypot(tx - from.x, ty - from.y);
  return cast(from.x, from.y, Math.atan2(ty - from.y, tx - from.x)).dist > d - .1;
}

function shoot() {
  if (state !== "play" || gunCd > 0) return;
  gunCd = .28; gun = .12;
  let target = null, targetD = 1e9;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    let rel = Math.atan2(e.y - player.y, e.x - player.x) - player.a;
    rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    const tol = Math.min(.5, .08 + (e.boss ? .25 : .18) / d); // easier to hit up close
    if (Math.abs(rel) < tol && d < targetD && los(player, e.x, e.y)) { target = e; targetD = d; }
  }
  if (target) {
    target.hp--; target.flash = .15;
    if (target.hp <= 0) {
      enemies.splice(enemies.indexOf(target), 1);
      toast(!enemies.length ? "All clear — get to the exit door 🚪"
        : target.boss ? "Big O is down! 😎💥" : "Suspect down (" + enemies.length + " left)");
    }
  }
}

function update(dt) {
  playTime += dt;
  gunCd -= dt; gun -= dt; hurt -= dt;

  // movement: keyboard + touch joystick
  let mv = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  let st = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  if (keys.arrowleft) player.a -= 2.6 * dt;
  if (keys.arrowright) player.a += 2.6 * dt;
  if (joy) {
    mv = Math.max(-1, Math.min(1, (joy.y0 - joy.y) / 40));
    st = Math.max(-1, Math.min(1, (joy.x - joy.x0) / 40));
  }
  const sp = 3.2 * dt;
  const nx = player.x + (Math.cos(player.a) * mv - Math.sin(player.a) * st) * sp;
  const ny = player.y + (Math.sin(player.a) * mv + Math.cos(player.a) * st) * sp;
  if (!blocked(nx, player.y)) player.x = nx;
  if (!blocked(player.x, ny)) player.y = ny;

  // floor cleared: walk up to the exit door to move on
  if (!enemies.length && doors.some(d => Math.hypot(player.x - d.x, player.y - d.y) < 1.1))
    return stageClear();

  for (const e of enemies) {
    e.flash -= dt; e.cd -= dt;
    const d = Math.hypot(player.x - e.x, player.y - e.y);
    const seen = d < 10 && los(e, player.x, player.y);
    if (seen && d > 1.3) {
      const esp = (e.boss ? 1.0 : 1.4) * dt;
      const ex = e.x + (player.x - e.x) / d * esp;
      const ey = e.y + (player.y - e.y) / d * esp;
      if (!blocked(ex, e.y)) e.x = ex;
      if (!blocked(e.x, ey)) e.y = ey;
      e.walk += dt;
    } else {
      e.walk = 0; // standing: legs together
    }
    if (seen && d < 8 && e.cd <= 0) {
      e.cd = e.boss ? 1.0 : 1.5;
      if (Math.random() < Math.max(.15, .55 - d * .05)) {
        player.hp -= e.boss ? 14 : 9;
        hurt = .35;
        if (player.hp <= 0) { player.hp = 0; state = "dead"; }
      }
    }
  }
}

const zbuf = new Array(COLS);

function drawSky(parallax) {
  const sg = ctx.createLinearGradient(0, 0, 0, H / 2);
  sg.addColorStop(0, "#0b1026");
  sg.addColorStop(1, "#25304e");
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H / 2);
  const off = ((parallax % 960) + 960) % 960;
  ctx.drawImage(skyline, off, 0, Math.min(960 - off, W), 70, 0, H / 2 - 70, Math.min(960 - off, W), 70);
  if (960 - off < W) ctx.drawImage(skyline, 0, 0, W - (960 - off), 70, 960 - off, H / 2 - 70, W - (960 - off), 70);
}

function render() {
  drawSky(player.a / (Math.PI * 2) * 960);
  ctx.fillStyle = "#26221d";
  ctx.fillRect(0, H / 2, W, H / 2);
  // textured walls
  ctx.imageSmoothingEnabled = false;
  for (let c = 0; c < COLS; c++) {
    const ang = player.a + (c / COLS - .5) * FOV;
    const r = cast(player.x, player.y, ang);
    const d = Math.max(.05, r.dist * Math.cos(ang - player.a)); // fisheye fix
    zbuf[c] = d;
    const h = Math.min(2400, H / d);
    const y = (H - h) / 2;
    ctx.drawImage(r.door ? doorTex : interiorTex, r.wallX * 64 | 0, 0, 1, 64, c * 2, y, 2, h);
    const dark = 1 - Math.max(0, 1 - d / 12) * (r.side ? .72 : 1);
    ctx.fillStyle = `rgba(5,7,12,${(dark * .85).toFixed(3)})`;
    ctx.fillRect(c * 2, Math.max(0, y), 2, Math.min(H, h));
    if (r.door && !enemies.length) { // unlocked: green glow
      ctx.fillStyle = "rgba(63,185,80,.28)";
      ctx.fillRect(c * 2, Math.max(0, y), 2, Math.min(H, h));
    }
  }
  // enemies, far to near
  const sorted = [...enemies].sort((a, b) =>
    Math.hypot(b.x - player.x, b.y - player.y) - Math.hypot(a.x - player.x, a.y - player.y));
  for (const e of sorted) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    let rel = Math.atan2(e.y - player.y, e.x - player.x) - player.a;
    rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    if (Math.abs(rel) > FOV / 2 + .3) continue;
    const sx = (0.5 + rel / FOV) * W;
    const col = Math.max(0, Math.min(COLS - 1, sx / 2 | 0));
    if (zbuf[col] < d - .25) continue; // ponytail: occlusion tested at sprite center column only
    const wallH = H / d;
    const sh = Math.min(360, wallH * (e.boss ? .8 : .62)); // people well below the ceiling line
    const sp = (e.boss ? bossSprites : thugSprites)[Math.floor(e.walk * 5) % 2];
    const sw = sh * sp.width / sp.height;
    const top = H / 2 + Math.min(H, wallH) / 2 - sh; // feet on the floor line
    ctx.drawImage(sp, sx - sw / 2, top, sw, sh);
    if (e.flash > 0) {
      ctx.fillStyle = "rgba(255,70,70,.45)";
      ctx.fillRect(sx - sw / 2, top, sw, sh);
    }
  }
  // crosshair
  ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 7, H / 2); ctx.lineTo(W / 2 + 7, H / 2);
  ctx.moveTo(W / 2, H / 2 - 7); ctx.lineTo(W / 2, H / 2 + 7);
  ctx.stroke();
  // first-person gun + muzzle flash
  const recoil = Math.max(0, gun) * 90;
  const gs = 8, gw = gunSprite.width * gs, gh = gunSprite.height * gs;
  const gy = H - gh + recoil;
  if (gun > 0) {
    ctx.fillStyle = "rgba(255,150,40,.9)";
    ctx.beginPath(); ctx.arc(W / 2, gy - 4, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,230,120,.95)";
    ctx.beginPath(); ctx.arc(W / 2, gy - 4, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.drawImage(gunSprite, W / 2 - gw / 2, gy, gw, gh);
  drawHud(stage.name + " · " + (enemies.length ? enemies.length + " hostiles" : "find the exit door 🚪"));
}

// --- drive mode: pseudo-3D highway chase ---

const HOR = 134; // horizon line
const GAP = 22; // meters between roadside buildings
function dproj(z, x) {
  const s = 2.4 / (z + 2.4);
  return { s, y: HOR + (H - 30 - HOR) * s, x: W / 2 + x * 200 * s };
}
function buildingAt(k) {
  const z = k * GAP - progress;
  const side = k % 2 ? 1 : -1;
  const p = dproj(z, side * (2.7 + hash(k) * 1.6));
  const bw = 240 * p.s * (.8 + hash(k * 3) * .6);
  const bh = (180 + hash(k * 7) * 300) * p.s * 6; // proper high-rise: many times taller than a person
  return { z, side, p, bw, bh };
}
function hasSniper(k) { return hash(k * 13) < .3; }
function sniperPoint(k) { // a low-floor window on the road-facing edge (stays on screen)
  const b = buildingAt(k);
  return { x: b.p.x - b.side * b.bw * .3, y: b.p.y - 200 * b.p.s, s: b.p.s, z: b.z };
}

function shootAt(px, py) {
  if (state !== "play" || gunCd > 0) return;
  gunCd = .25; gun = .1;
  aim = { x: px, y: py };
  let hit = null, hd = 1e9;
  for (const b of bikers) {
    const p = dproj(b.z, b.x);
    const r = 14 + 120 * p.s;
    if (Math.hypot(px - p.x, py - (p.y - 55 * p.s)) < r && b.z < hd) { hd = b.z; hit = b; }
  }
  let hitK = -1;
  const base = Math.floor(progress / GAP);
  for (let n = 1; n <= 16; n++) {
    const k = base + n;
    if (!hasSniper(k) || deadSnipers.has(k)) continue;
    const pt = sniperPoint(k);
    if (pt.z > 40) continue;
    if (Math.hypot(px - pt.x, py - pt.y) < 10 + 60 * pt.s && pt.z < hd) { hd = pt.z; hit = null; hitK = k; }
  }
  if (hitK >= 0) { deadSnipers.add(hitK); kills++; }
  else if (hit) { bikers.splice(bikers.indexOf(hit), 1); kills++; }
}

function updateDrive(dt) {
  playTime += dt;
  gunCd -= dt; gun -= dt; hurt -= dt;
  const steer = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  playerX = Math.max(-1.35, Math.min(1.35, playerX + steer * 2.2 * dt));
  progress += 28 * dt;
  if (progress >= stage.dist) return stageClear();

  spawnCd -= dt;
  if (spawnCd <= 0) {
    spawnCd = stage.rate;
    bikers.push({ z: 50, x: Math.random() * 2.4 - 1.2, hold: 5 + Math.random() * 7, cd: 1 + Math.random(), flash: 0 });
  }
  for (const b of bikers) {
    b.flash -= dt; b.cd -= dt;
    if (b.z > b.hold) b.z -= 9 * dt; // closing in
    b.x += (playerX - b.x) * .4 * dt + Math.sin(playTime * 2 + b.hold) * .15 * dt;
    if (b.z <= b.hold + 4 && b.cd <= 0) {
      b.cd = 1.3 + Math.random();
      b.flash = .15;
      if (Math.random() < .4) {
        player.hp -= 8;
        hurt = .35;
        if (player.hp <= 0) { player.hp = 0; state = "dead"; }
      }
    }
  }
  // window snipers on passing buildings
  const base = Math.floor(progress / GAP);
  for (let n = 1; n <= 16; n++) {
    const k = base + n;
    if (!hasSniper(k) || deadSnipers.has(k)) continue;
    const z = k * GAP - progress;
    if (z > 30 || z < 3) continue;
    const s = snipers[k] || (snipers[k] = { cd: 1 + Math.random() * 1.5, flash: 0 });
    s.flash -= dt; s.cd -= dt;
    if (s.cd <= 0) {
      s.cd = 1.7 + Math.random();
      s.flash = .15;
      if (Math.random() < .35) {
        player.hp -= 6;
        hurt = .35;
        if (player.hp <= 0) { player.hp = 0; state = "dead"; }
      }
    }
  }
}

function renderDrive() {
  drawSky(playerX * -40);
  // shoulder / ground
  ctx.fillStyle = "#1e2126";
  ctx.fillRect(0, HOR, W, H - HOR);
  // roadside high-rises, far to near
  ctx.imageSmoothingEnabled = false;
  for (let n = 16; n >= 1; n--) {
    const k = Math.floor(progress / GAP) + n;
    const b = buildingAt(k);
    ctx.drawImage(wallTex, b.p.x - b.bw / 2, b.p.y - b.bh, b.bw, b.bh);
    ctx.fillStyle = `rgba(5,7,12,${(Math.min(.85, b.z / 60)).toFixed(3)})`;
    ctx.fillRect(b.p.x - b.bw / 2, b.p.y - b.bh, b.bw, b.bh);
    // gangster at a window, taking potshots at your cruiser
    if (hasSniper(k) && !deadSnipers.has(k) && b.z < 40) {
      const pt = sniperPoint(k);
      const th = 55 * pt.s, tw = th * thugSprites[0].width / thugSprites[0].height; // window-sized human
      ctx.drawImage(thugSprites[0], pt.x - tw / 2, pt.y - th / 2, tw, th);
      const sn = snipers[k];
      if (sn && sn.flash > 0) {
        ctx.fillStyle = "rgba(255,230,120,.95)";
        ctx.beginPath(); ctx.arc(pt.x + b.side * -tw * .4, pt.y, 2 + 6 * pt.s, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  // road
  const nl = dproj(0, -1.6), nr = dproj(0, 1.6), fl = dproj(90, -1.6), fr = dproj(90, 1.6);
  ctx.fillStyle = "#33363d";
  ctx.beginPath();
  ctx.moveTo(nl.x, H); ctx.lineTo(nr.x, H); ctx.lineTo(fr.x, fr.y); ctx.lineTo(fl.x, fl.y);
  ctx.closePath(); ctx.fill();
  // edge lines + center dashes
  for (const ex of [-1.45, 1.45]) {
    const a = dproj(.1, ex), b = dproj(90, ex);
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x, H); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let k = 0; k < 24; k++) {
    const z = k * 4 - progress % 4;
    if (z < .3) continue;
    const a = dproj(z, 0), b2 = dproj(z + 1.8, 0);
    ctx.fillStyle = "rgba(230,220,140,.75)";
    ctx.fillRect(a.x - 3 * a.s, b2.y, 6 * a.s, a.y - b2.y);
  }
  // bikers, far to near
  for (const b of [...bikers].sort((p1, p2) => p2.z - p1.z)) {
    const p = dproj(b.z, b.x);
    const bh = 115 * p.s, bw = bh * bikerSprite.width / bikerSprite.height; // rider ~ car-roof height
    ctx.drawImage(bikerSprite, p.x - bw / 2, p.y - bh, bw, bh);
    if (b.flash > 0) { // muzzle flash at their gun hand
      ctx.fillStyle = "rgba(255,230,120,.95)";
      ctx.beginPath(); ctx.arc(p.x - bw * .4, p.y - bh * .65, 4 + 8 * p.s, 0, Math.PI * 2); ctx.fill();
    }
  }
  // police cruiser + siren glow
  const cs = 6, cw = carSprite.width * cs, ch = carSprite.height * cs;
  const cx = W / 2 + playerX * 150 - cw / 2, cy = H - ch - 8;
  const sirenBlue = Math.floor(playTime * 4) % 2 === 0;
  ctx.fillStyle = sirenBlue ? "rgba(60,110,255,.35)" : "rgba(255,60,50,.35)";
  ctx.beginPath(); ctx.arc(cx + cw / 2, cy + 6, 26, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(carSprite, cx, cy, cw, ch);
  // your muzzle flash from the window
  if (gun > 0) {
    ctx.fillStyle = "rgba(255,230,120,.95)";
    ctx.beginPath(); ctx.arc(cx + 6, cy + 20, 10, 0, Math.PI * 2); ctx.fill();
  }
  // crosshair at aim point
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(aim.x - 8, aim.y); ctx.lineTo(aim.x + 8, aim.y);
  ctx.moveTo(aim.x, aim.y - 8); ctx.lineTo(aim.x, aim.y + 8);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(aim.x, aim.y, 5, 0, Math.PI * 2); ctx.stroke();
  // progress bar to destination
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(10, 24, W - 20, 6);
  ctx.fillStyle = "#58a6ff"; ctx.fillRect(10, 24, (W - 20) * progress / stage.dist, 6);
  drawHud(stage.name + " · " + kills + " gangsters down");
}

function drawHud(label) {
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fillRect(8, H - 26, 130, 18);
  ctx.fillStyle = player.hp > 40 ? "#3fb950" : "#f85149";
  ctx.fillRect(10, H - 24, 1.26 * player.hp, 14);
  ctx.fillStyle = "#fff";
  ctx.font = "12px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("HP " + player.hp, 14, H - 13);
  ctx.fillText(label, 10, 16);
}

// --- screens & loop ---

function wrapText(text, x, y, maxW, lh) {
  const words = text.split(" ");
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW) { ctx.fillText(line, x, y); y += lh; line = w; }
    else line = t;
  }
  ctx.fillText(line, x, y);
  return y + lh;
}

function drawScreen(title, body, footer) {
  ctx.fillStyle = "#10131a";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#e6b840";
  ctx.font = "bold 20px monospace";
  ctx.fillText(title, W / 2, 40);
  ctx.fillStyle = "#c9d1d9";
  ctx.font = "13px monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  wrapText(body, 36, 76, W - 72, 19);
  ctx.textAlign = "center";
  ctx.fillStyle = "#8b949e";
  ctx.fillText(footer, W / 2, H - 26);
}

const DEAD_TEXT = {
  raid: "The gang got you. Production is still hostage — but the stairwell is still clear. Patch yourself up and take the floor again, Detective.",
  drive: "Your cruiser is wrecked on the shoulder. Dispatch sends a tow and a spare — get back on the road, they're getting away.",
};

function frame(now) {
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  if (state === "play") {
    if (stage.type === "drive") updateDrive(dt); else update(dt);
    if (state === "play") { if (stage.type === "drive") renderDrive(); else render(); }
  }
  if (state === "story") drawScreen(stage.name, stage.story, "click or press Enter to start");
  else if (state === "dead") drawScreen("MISSION FAILED 💀", DEAD_TEXT[stage.type], "click or press Enter to retry");
  else if (state === "won") drawScreen("CASE CLOSED 🏆", EPILOGUE + " Run time: " + Math.round(playTime) + "s.", "click or press Enter for a new run");
  requestAnimationFrame(frame);
}

function advance() {
  if (state === "story") {
    if (mission === 0) playTime = 0;
    state = "play";
  } else if (state === "dead") {
    loadStage(mission);
  } else if (state === "won") {
    loadStage(0);
  }
}

function canvasPoint(e) {
  const rect = board.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: (p.clientX - rect.left) * (W / rect.width), y: (p.clientY - rect.top) * (H / rect.height) };
}

// --- input ---
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (k === "enter" && state !== "play") return advance();
  if (k === " ") {
    if (state !== "play") return advance();
    if (stage.type === "drive") {
      // space: auto-aim the nearest rider
      let n = null;
      for (const b of bikers) if (!n || b.z < n.z) n = b;
      if (n) { const p = dproj(n.z, n.x); shootAt(p.x, p.y - 55 * p.s); }
    } else shoot();
    return;
  }
  keys[k] = true;
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

board.addEventListener("click", (e) => {
  if (state !== "play") return advance();
  if (stage.type === "drive") return shootAt(canvasPoint(e).x, canvasPoint(e).y);
  if (document.pointerLockElement !== board && matchMedia("(pointer: fine)").matches)
    board.requestPointerLock();
  shoot();
});
addEventListener("mousemove", (e) => {
  if (state !== "play") return;
  if (stage.type === "drive") { aim = canvasPoint(e); return; }
  if (document.pointerLockElement === board) player.a += e.movementX * .0032;
});

const touches = {};
board.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (state !== "play") return advance();
  const rect = board.getBoundingClientRect();
  for (const t of e.changedTouches) {
    const left = t.clientX - rect.left < rect.width / 2;
    touches[t.identifier] = { x: t.clientX, y: t.clientY, t0: performance.now(), moved: 0, left };
    if (stage.type === "raid" && left) joy = { id: t.identifier, x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY };
  }
});
board.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const tr = touches[t.identifier];
    if (!tr) continue;
    tr.moved += Math.abs(t.clientX - tr.x) + Math.abs(t.clientY - tr.y);
    if (state === "play" && stage.type === "drive") {
      playerX = Math.max(-1.35, Math.min(1.35, playerX + (t.clientX - tr.x) * .008));
    } else if (tr.left && joy && joy.id === t.identifier) { joy.x = t.clientX; joy.y = t.clientY; }
    else if (!tr.left && state === "play") player.a += (t.clientX - tr.x) * .008;
    tr.x = t.clientX; tr.y = t.clientY;
  }
});
board.addEventListener("touchend", (e) => {
  const rect = board.getBoundingClientRect();
  for (const t of e.changedTouches) {
    const tr = touches[t.identifier];
    if (!tr) continue;
    const tap = tr.moved < 12 && performance.now() - tr.t0 < 350;
    if (tap && state === "play") {
      if (stage.type === "drive")
        shootAt((t.clientX - rect.left) * (W / rect.width), (t.clientY - rect.top) * (H / rect.height));
      else if (!tr.left) shoot();
    }
    if (joy && joy.id === t.identifier) joy = null;
    delete touches[t.identifier];
  }
});

$("restart").addEventListener("click", () => loadStage(mission));

loadStage(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
