<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Tool — Format, Validate, Convert</title>
<meta name="description" content="Format, minify and validate JSON, sort keys, convert to YAML or CSV. Runs offline in your browser.">

<link rel="stylesheet" href="assets/common.css">
<style>
  textarea { height: 320px; }
</style>
</head>
<body>
<script src="assets/common.js"></script>

<header>
  <h1>⚡ JSON<span>Tool</span></h1>
  <div class="controls">
    <button id="theme" title="Theme: auto / light / dark">🌓</button>
    <button id="format" class="primary">Format</button>
    <button id="minify">Minify</button>
    <button id="toYaml">→ YAML</button>
    <button id="toCsv">→ CSV</button>
  </div>
</header>

<div class="options">
  <label class="checkbox"><input type="checkbox" id="sortKeys"> Sort keys</label>
  <select id="indent" title="Indentation">
    <option value="2">2 spaces</option>
    <option value="4">4 spaces</option>
    <option value="tab">Tabs</option>
  </select>
  <button id="useOutput" title="Move output back to input">↰ Use output as input</button>
  <button id="sample">Sample</button>
  <button id="clear">Clear</button>
  <button id="copy">📋 Copy output</button>
</div>

<div class="panes">
  <div class="pane">
    <div class="pane-header">
      <span>Input JSON</span>
      <span class="status" id="statusIn"></span>
    </div>
    <textarea id="input" placeholder="Paste JSON here… (messy JSON is repaired: comments, single quotes, unquoted keys, trailing/missing commas)" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span>Output</span>
      <span class="status" id="statusOut"></span>
    </div>
    <textarea id="output" placeholder="Result appears here…" spellcheck="false"></textarea>
  </div>
</div>

<p class="hint">Ctrl/Cmd + Enter to format · CSV conversion expects an array of objects (nested values are JSON-stringified) · validation runs as you type</p>
<div id="toast"></div>

<script>
"use strict";

function sortKeysDeep(value) {
  if (Array.isArray(value)) return value.map(sortKeysDeep);
  if (value !== null && typeof value === "object") {
    const out = {};
    for (const key of Object.keys(value).sort()) out[key] = sortKeysDeep(value[key]);
    return out;
  }
  return value;
}

// Lenient recursive-descent parser: comments, single/unquoted keys, trailing or
// missing commas, NaN/Infinity, Python True/False/None, leading/trailing junk.
function parseJsonLenient(src) {
  let i = 0;
  const err = (m) => { throw new SyntaxError(m + " at position " + i); };
  function ws() {
    for (;;) {
      while (i < src.length && /\s/.test(src[i])) i++;
      if (src[i] === "/" && src[i + 1] === "/") { while (i < src.length && src[i] !== "\n") i++; continue; }
      if (src[i] === "/" && src[i + 1] === "*") { i += 2; while (i < src.length && !(src[i] === "*" && src[i + 1] === "/")) i++; i += 2; continue; }
      return;
    }
  }
  function str(q) {
    i++; let out = "";
    while (i < src.length && src[i] !== q) {
      if (src[i] === "\\") {
        i++;
        const c = src[i++];
        if (c === "n") out += "\n";
        else if (c === "t") out += "\t";
        else if (c === "r") out += "\r";
        else if (c === "b") out += "\b";
        else if (c === "f") out += "\f";
        else if (c === "u") { out += String.fromCharCode(parseInt(src.substr(i, 4), 16)); i += 4; }
        else if (c === "\n") ; // line continuation
        else out += c;
      } else out += src[i++];
    }
    if (src[i] !== q) err("unterminated string");
    i++;
    return out;
  }
  function word() {
    const start = i;
    while (i < src.length && /[^\s:,{}\[\]"']/.test(src[i])) i++;
    return src.slice(start, i);
  }
  function value() {
    ws();
    const c = src[i];
    if (c === undefined) err("unexpected end of input");
    if (c === "{") return obj();
    if (c === "[") return arr();
    if (c === '"' || c === "'") return str(c);
    const w = word();
    if (!w) err("unexpected character " + JSON.stringify(c));
    if (w === "true" || w === "True") return true;
    if (w === "false" || w === "False") return false;
    if (w === "null" || w === "None" || w === "undefined") return null;
    if (w === "NaN") return NaN;
    if (w === "Infinity" || w === "+Infinity") return Infinity;
    if (w === "-Infinity") return -Infinity;
    const n = Number(w);
    if (!Number.isNaN(n)) return n;
    return w; // bare word -> string
  }
  function key() {
    ws();
    const c = src[i];
    if (c === '"' || c === "'") return str(c);
    const w = word();
    if (!w) err("expected key");
    return w;
  }
  function sep(close) {
    ws();
    if (src[i] === ",") { i++; ws(); return; }
    if (src[i] === close || i >= src.length) return;
    // missing comma — tolerate
  }
  function obj() {
    i++; const o = {};
    for (;;) {
      ws();
      if (src[i] === "}") { i++; return o; }
      if (i >= src.length) err("unterminated object");
      const k = key();
      ws();
      if (src[i] === ":" || src[i] === "=") i++;
      o[k] = value();
      sep("}");
    }
  }
  function arr() {
    i++; const a = [];
    for (;;) {
      ws();
      if (src[i] === "]") { i++; return a; }
      if (i >= src.length) err("unterminated array");
      a.push(value());
      sep("]");
    }
  }
  ws();
  // skip leading junk before the first { or [ when present
  const brace = src.search(/[{[]/);
  if (src[i] !== "{" && src[i] !== "[" && brace !== -1) i = brace;
  const v = value();
  return v;
}

function parseJsonLoose(text) {
  try {
    return { value: JSON.parse(text), note: "" };
  } catch (firstErr) {
    try {
      return { value: parseJsonLenient(text), note: " (repaired)" };
    } catch (e) {
      throw firstErr;
    }
  }
}

function getValue() {
  const text = $("input").value.trim();
  if (!text) throw new Error("input is empty");
  const { value, note } = parseJsonLoose(text);
  setStatus($("statusIn"), "valid JSON" + note, "ok");
  return $("sortKeys").checked ? sortKeysDeep(value) : value;
}

function indentArg() {
  const v = $("indent").value;
  return v === "tab" ? "\t" : Number(v);
}

// ---------- JSON → YAML ----------

function yamlScalarStr(s) {
  if (s === "" || /^[\s\-?:,[\]{}#&*!|>'"%@`]|[\s:#]|^(true|false|null|~|yes|no|on|off)$|^[-+]?[\d.]/i.test(s) || /\n/.test(s)) {
    return JSON.stringify(s);
  }
  return s;
}

function toYaml(value, indent = 0) {
  const pad = "  ".repeat(indent);
  if (value === null) return "null";
  if (typeof value === "boolean" || typeof value === "number") return String(value);
  if (typeof value === "string") return yamlScalarStr(value);
  if (Array.isArray(value)) {
    if (!value.length) return "[]";
    return value.map(v => {
      const inner = toYaml(v, indent + 1);
      if (v !== null && typeof v === "object" && Object.keys(v).length) {
        return pad + "- " + inner.replace(/^\s*/, "").split("\n").map((l, i) => i === 0 ? l : "  " + l).join("\n");
      }
      return pad + "- " + inner;
    }).join("\n");
  }
  const keys = Object.keys(value);
  if (!keys.length) return "{}";
  return keys.map(k => {
    const v = value[k];
    const key = yamlScalarStr(k);
    if (v !== null && typeof v === "object" && (Array.isArray(v) ? v.length : Object.keys(v).length)) {
      return pad + key + ":\n" + toYaml(v, indent + 1);
    }
    return pad + key + ": " + toYaml(v, indent);
  }).join("\n");
}

// ---------- JSON → CSV ----------

function csvCell(v) {
  if (v === null || v === undefined) return "";
  const s = typeof v === "object" ? JSON.stringify(v) : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function toCsv(value) {
  if (!Array.isArray(value)) throw new Error("CSV needs a JSON array");
  if (!value.length) return "";
  // All-primitive (or null) array → one value per line.
  if (value.every(r => r === null || typeof r !== "object")) {
    return value.map(csvCell).join("\n");
  }
  // Object rows → columns from the union of keys. Reject mixed arrays, where a
  // primitive's "keys" would otherwise be its string indices (garbage columns).
  if (value.some(r => r === null || typeof r !== "object" || Array.isArray(r))) {
    throw new Error("CSV needs an array of plain objects (rows are mixed types)");
  }
  const cols = [];
  for (const rowObj of value) {
    for (const k of Object.keys(rowObj || {})) if (!cols.includes(k)) cols.push(k);
  }
  const lines = [cols.map(csvCell).join(",")];
  for (const rowObj of value) {
    lines.push(cols.map(c => csvCell(rowObj ? rowObj[c] : "")).join(","));
  }
  return lines.join("\n");
}

// ---------- Actions ----------

function act(fn, okMsg) {
  setStatus($("statusOut"), "");
  try {
    $("output").value = fn();
    setStatus($("statusOut"), okMsg, "ok");
  } catch (e) {
    setStatus($("statusOut"), e.message, "err");
    if (e instanceof SyntaxError) setStatus($("statusIn"), "invalid JSON: " + e.message, "err");
  }
}

$("format").addEventListener("click", () => act(() => JSON.stringify(getValue(), null, indentArg()), "formatted"));
$("minify").addEventListener("click", () => act(() => JSON.stringify(getValue()), "minified"));
$("toYaml").addEventListener("click", () => act(() => toYaml(getValue()), "converted to YAML"));
$("toCsv").addEventListener("click", () => act(() => toCsv(getValue()), "converted to CSV"));
$("copy").addEventListener("click", () => copyText($("output").value, "Output copied"));

$("useOutput").addEventListener("click", () => {
  if (!$("output").value) { toast("Output is empty"); return; }
  $("input").value = $("output").value;
  $("output").value = "";
  validate();
});

$("clear").addEventListener("click", () => {
  $("input").value = "";
  $("output").value = "";
  setStatus($("statusIn"), "");
  setStatus($("statusOut"), "");
});

$("sample").addEventListener("click", () => {
  $("input").value = JSON.stringify([
    { id: 1, name: "Alice", role: "admin", tags: ["staff", "ops"] },
    { id: 2, name: "Bob", role: "viewer", tags: [] },
    { id: 3, name: "Citra", role: "editor", address: { city: "Jakarta" } },
  ]);
  act(() => JSON.stringify(getValue(), null, indentArg()), "formatted");
});

function validate() {
  const text = $("input").value.trim();
  if (!text) { setStatus($("statusIn"), ""); return; }
  try {
    const { note } = parseJsonLoose(text);
    setStatus($("statusIn"), "valid JSON" + note, "ok");
  } catch (e) {
    setStatus($("statusIn"), "invalid: " + e.message, "err");
  }
}

let t;
$("input").addEventListener("input", () => {
  clearTimeout(t);
  t = setTimeout(validate, 300);
});

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    act(() => JSON.stringify(getValue(), null, indentArg()), "formatted");
  }
});

// Drag either editor's resize handle and both follow.
(function syncHeights() {
  const boxes = [$("input"), $("output")];
  let busy = false;
  const ro = new ResizeObserver((entries) => {
    if (busy) return;
    busy = true;
    const h = entries[0].target.style.height;
    for (const b of boxes) b.style.height = h;
    busy = false;
  });
  boxes.forEach(b => ro.observe(b));
})();
</script>
</body>
</html>
